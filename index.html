<!doctype html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenția Secretă de Matematică</title>
<style>
:root{--bg:#2b1b6b;--bg2:#6a2fb8;--card:#fff;--ink:#241a4a;--acc:#ffc93c;--ok:#22c55e;--no:#ef4444;--mut:#e6dcff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1040;--bg2:#4a1f8a;--card:#f4efff}}
:root[data-theme="dark"]{--bg:#1a1040;--bg2:#4a1f8a;--card:#f4efff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:#fff;font-family:"Trebuchet MS","Comic Sans MS",Verdana,sans-serif}
#app{max-width:780px;margin:0 auto;padding:14px}
#top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mas{font-size:3rem;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
#bub{flex:1;background:var(--card);color:var(--ink);padding:10px 14px;border-radius:18px;font-size:1.05rem;position:relative}
#bub:before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.st{background:var(--acc);color:#4a3200;font-weight:bold;padding:8px 12px;border-radius:14px;font-size:1.2rem;white-space:nowrap}
h1{font-size:clamp(1.4rem,5vw,2.1rem);margin:6px 0 12px;text-align:center;color:var(--acc);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.card{background:var(--card);color:var(--ink);border-radius:24px;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.25);animation:pop .35s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
h2{margin:0 0 8px;font-size:1.2rem}
.q{font-size:clamp(1.35rem,4.5vw,1.9rem);font-weight:bold;margin:10px 0 16px}
.opts{display:grid;gap:10px}
.opt,.big,.node{font:inherit;cursor:pointer;border:0;border-radius:18px;transition:transform .12s}
.opt{background:#efe7ff;color:var(--ink);font-size:1.3rem;padding:14px;box-shadow:0 5px 0 #c9b6f5;font-weight:bold}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt.good{background:var(--ok);color:#fff;box-shadow:0 5px 0 #15803d;animation:pop .4s}
.opt.bad{background:#fecaca;color:#7f1d1d;box-shadow:none;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.big{background:var(--acc);color:#4a3200;font-size:1.4rem;font-weight:bold;padding:14px 26px;box-shadow:0 6px 0 #c58f00;margin-top:14px}
.big:hover{transform:scale(1.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.node{background:var(--card);color:var(--ink);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.node:hover{transform:translateY(-4px) rotate(-1.5deg)}
.node b{font-size:2.4rem}.node span{font-weight:bold}.node small{opacity:.7}
.node.ok{background:#d1fae5}
.dots{display:flex;gap:6px;margin-bottom:8px}.dots i{width:14px;height:14px;border-radius:50%;background:#ddd}.dots .on{background:var(--ok)}.dots .cur{background:var(--acc)}
#fb{margin-top:14px;font-size:1.15rem;font-weight:bold}
.key{background:#fff3c4;border:3px dashed #e0a800;border-radius:14px;padding:10px;margin-top:10px;font-size:1.3rem}
.hint{text-align:center;color:var(--mut);margin-top:14px}
.dg{width:62px;height:76px;font-size:2.4rem;text-align:center;border-radius:14px;border:4px solid #c9b6f5;margin:4px;font-family:inherit}
.center{text-align:center}.trophy{font-size:5rem;animation:bob 1s infinite}
input.nm{font:inherit;font-size:1.3rem;padding:10px;border-radius:12px;border:3px solid #c9b6f5;width:100%;margin-top:6px}
#cv{position:fixed;inset:0;pointer-events:none;z-index:9}
</style></head><body>
<canvas id="cv"></canvas>
<div id="app">
<div id="top"><div class="mas">🦊</div><div id="bub"></div><div class="st">⭐ <span id="sc">0</span></div></div>
<h1>🕵️ Agenția Secretă de Matematică</h1>
<div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const M=[
{e:"🕵️",n:"Spionul numerelor",s:"Fiecare răspuns corect îți dă o CIFRĂ a codului secret. Scrie-o în carnetul de detectiv!",
 q:[["Predecesorul lui 90 900","90 901|90 899|90 800",1,"Predecesorul = numărul de dinainte: 90 900 − 1 = 90 899.","9"],
    ["Cel mai mare număr cu 5 cifre DIFERITE","99 999|98 765|98 760",1,"Cifrele diferite, de la cea mai mare: 9, 8, 7, 6, 5.","9"],
    ["Dublul lui 40","20|44|80",2,"Dublul = de 2 ori mai mult: 40 × 2 = 80.","8"],
    ["De câte ori este 40 mai mare decât 4?","10|36|160",0,"Se împarte: 40 : 4 = 10.","1"]]},
{e:"🔺",n:"Arhitectul",s:"Planurile clădirii s-au amestecat! Potrivește descrierea cu forma.",
 q:[["Are 3 vârfuri și 3 laturi","Triunghi|Cerc|Pătrat",0,"Tri = trei: triunghi."],
    ["Nu are nicio latură și niciun vârf","Triunghi|Cerc|Dreptunghi",1,"Cercul e rotund, fără colțuri."],
    ["Toate cele 4 laturi sunt egale și are 4 unghiuri drepte","Pătrat|Dreptunghi|Pentagon",0,"Doar pătratul are TOATE laturile egale."],
    ["4 unghiuri drepte, laturile opuse egale, dar nu toate la fel","Pătrat|Dreptunghi|Triunghi",1,"Dreptunghiul: două laturi lungi, două scurte."],
    ["Are 5 laturi și 5 vârfuri","Pentagon|Dreptunghi|Cerc",0,"Penta = cinci."]]},
{e:"⏱️",n:"Adevărat sau capcană?",s:"Unele propoziții te păcălesc! Observă capcana și explică DE CE.",
 q:[["„Într-o oră și un sfert sunt 120 de minute.”","Adevărat|Fals",1,"O oră = 60 min, un sfert = 15 min → 75 min. Explică de ce!"],
    ["„1 km = 1 000 m”","Adevărat|Fals",0,"Kilo înseamnă o mie."],
    ["„Jumătatea lui 90 este 40.”","Adevărat|Fals",1,"90 : 2 = 45."],
    ["„Un sfert de oră are 15 minute.”","Adevărat|Fals",0,"60 : 4 = 15."]]},
{e:"⚔️",n:"Battle de calcul",s:"Rezolvă! Apoi spune ce STRATEGIE ai folosit.",
 q:[["5 000 − 1 847 = ?","3 153|3 247|4 153",0,"Scădere în coloniță, cu împrumut."],
    ["300 × 270 = ?  (spune strategia!)","8 100|81 000|810 000",1,"3 × 27 = 81, apoi trei zerouri."],
    ["7 296 : 8 = ?","912|902|812",0,"Verificare: 912 × 8 = 7 296."]]},
{e:"🛒",n:"Managerul de magazin",s:"Magazinul a încasat 16 800 lei într-o zi, dar ai uitat cât costă un costum. Ajută-l pe vânzător să afle!",
 q:[["Un palton costă 2 200 lei. Cât costă 4 paltoane?","6 200 lei|8 800 lei|880 lei",1,"Patru paltoane costă de patru ori mai mult decât unul, adică 8 800 lei."],
    ["În total, magazinul a încasat 16 800 lei, iar din vânzarea paltoanelor a câștigat 8 800 lei. Ce venit a adus vânzarea costumelor?","8 000 lei|7 000 lei|25 600 lei",0,"Din toți banii încasați scazi banii de la paltoane și rămân 8 000 lei."],
    ["Cele 5 costume au adus împreună 8 000 lei. Cât costă un singur costum?","1 000 lei|1 600 lei|16 000 lei",1,"Împarți cei 8 000 lei la cele 5 costume și obții 1 600 lei pentru fiecare."]]},
{e:"🕐",n:"Cursa contra timpului",s:"Marin merge la antrenament. Ajută-l să afle cât este ceasul după fiecare etapă.",
 q:[["Antrenamentul lui Marin începe la ora 15:30 și durează 50 de minute. La ce oră se termină?","16:20|16:00|15:80",0,"De la 15:30 până la 16:00 sunt 30 de minute, mai rămân 20, deci se termină la 16:20."],
    ["După antrenament, Marin vorbește cu antrenorul 15 minute. La ce oră se termină discuția?","16:35|16:50|17:05",0,"La 16:20 adaugi 15 minute și ajungi la 16:35."],
    ["Apoi Marin pleacă spre casă, iar drumul durează 25 de minute. La ce oră ajunge acasă?","17:00|16:60|17:15",0,"De la 16:35 mai sunt 25 de minute până la 17:00. Ora 16:60 nu există!"],
    ["Câte minute au trecut în total, de când a început antrenamentul până când Marin a ajuns acasă?","80 de minute|90 de minute|100 de minute",1,"Aduni 50, 15 și 25 de minute și obții 90 de minute, adică o oră și jumătate."]]},
{e:"🧅",n:"Piața",s:"Hai să facem niște cumpărături!",
 q:[["Pentru 900 de kilograme de ceapă s-au plătit 7 200 lei. Cât costă un kilogram de ceapă?","80 lei|9 lei|8 lei",2,"Împarți banii plătiți la numărul de kilograme și obții 8 lei pentru un kilogram."],
    ["Cât vor costa 900 de kilograme de cartofi, dacă un kilogram costă 9 lei?","8 100 lei|810 lei|81 000 lei",0,"Fiecare dintre cele 900 de kilograme costă 9 lei, deci plătești 8 100 lei."],
    ["Ce cumpărătură este mai scumpă?","Ceapa (7 200 lei)|Cartofii (8 100 lei)",1,"Cartofii costă mai mult decât ceapa, cu 900 lei în plus."]]},
{e:"🚗",n:"Misiunea Moldova",s:"O mașină pleacă de la Chișinău spre Soroca. Ajută-ne să aflăm cât de lung este drumul!",
 q:[["Dacă o mașină merge 60 de kilometri într-o oră, câți kilometri face în 2 ore și jumătate?","120 de kilometri|150 de kilometri|180 de kilometri",1,"În 2 ore face 120 de kilometri, iar în jumătate de oră încă 30, deci 150 de kilometri."],
    ["Drumul are 150 de kilometri. Câți metri are? Un kilometru are o mie de metri.","150 de metri|15 000 de metri|150 000 de metri",2,"Fiecare kilometru are o mie de metri, deci 150 de kilometri înseamnă 150 000 de metri."],
    ["NIVEL EXPERT: Dacă mașina ar merge 80 de kilometri într-o oră, câți metri ar face în aceleași 2 ore și jumătate?","200 000 de metri|160 000 de metri|82 500 de metri",0,"În 2 ore face 160 de kilometri, iar în jumătate de oră încă 40, deci 200 de kilometri, adică 200 000 de metri."]]}
];
const TOTAL=M.reduce((a,m)=>a+m.q.length,0);
let done=new Set(),stars=0,cur=0,k=0,tries=0,name="agent",ac,run=false,P=[];
const say=t=>$("#bub").textContent=t, view=h=>$("#view").innerHTML=h;
function snd(fs,type){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.11;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.26)})}catch(e){}}
const cv=$("#cv"),cx=cv.getContext("2d");
function fit(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",fit);fit();
function boom(n,x,y){x=x??innerWidth/2;y=y??innerHeight/3;for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*16,vy:Math.random()*-13-2,r:Math.random()*7+4,c:`hsl(${Math.random()*360},90%,60%)`,l:80+Math.random()*50});if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});if(P.length)requestAnimationFrame(loop);else run=false}
const praise=["Genial!","Exact! 🎉","Super agent!","Bravo, ești un geniu!","Wow, ce rapid!","Perfect! 🚀"];
function intro(){say("Salut! Eu sunt Vulpoi, ajutorul tău secret.");view(`<div class=card><h2>🔐 Un seif secret te așteaptă!</h2><p class=q>Rezolvă 8 misiuni, strânge cifrele codului în carnet și deschide seiful.</p>Cum te cheamă, agent?<input class=nm id=nm placeholder="Numele tău"><div class=center><button class=big onclick="begin()">Începe aventura! 🚀</button></div></div>`)}
function begin(){name=($("#nm").value||"").trim()||"agent";boom(60);snd([523,659,784,1047]);hub()}
function hub(){say(done.size==M.length?`Ai terminat tot, ${name}! La seif!`:`Alege o misiune, ${name}!`);
 view(`<div class=grid>${M.map((m,i)=>`<button class="node ${done.has(i)?"ok":""}" onclick="start(${i})"><b>${m.e}</b><span>${m.n}</span><small>${done.has(i)?"✅ gata":"Misiunea "+(i+1)}</small></button>`).join("")}</div>${done.size==M.length?`<div class=center><button class=big onclick="safe()">🔐 Deschide seiful!</button></div>`:`<p class=hint>Termină toate cele 8 misiuni ca să ajungi la seif 🔐</p>`}`)}
function start(i){cur=i;k=0;view(`<div class=card><div class=trophy style="font-size:4rem">${M[i].e}</div><h2>${M[i].n}</h2><p class=q>${M[i].s}</p><div class=center><button class=big onclick="ask()">Hai la treabă!</button></div></div>`);say("Citește bine și gândește-te!")}
function ask(){const m=M[cur],[q,o,a]=m.q[k];tries=0;
 view(`<div class=card><div class=dots>${m.q.map((_,i)=>`<i class="${i<k?"on":i==k?"cur":""}"></i>`).join("")}</div><h2>${m.e} ${m.n}</h2><p class=q>${q}</p><div class=opts>${o.split("|").map((t,j)=>`<button class=opt onclick="pick(${j},event)">${t}</button>`).join("")}</div><div id=fb></div></div>`);say("Alege răspunsul corect!")}
function pick(j,ev){const m=M[cur],[q,o,a,ex,d]=m.q[k],bs=document.querySelectorAll(".opt"),b=bs[j];
 if(j==a){bs.forEach(x=>x.disabled=true);b.classList.add("good");if(!tries){stars++;$("#sc").textContent=stars}
  const r=b.getBoundingClientRect();boom(70,r.left+r.width/2,r.top);snd([660,880,1175]);say(praise[Math.floor(Math.random()*praise.length)]);
  $("#fb").innerHTML=`✅ ${ex}${d?`<div class=key>🔑 Cifra secretă este <b>${d}</b> — scrie-o în carnetul de detectiv!</div>`:""}<div class=center><button class=big onclick="next()">${k+1<m.q.length?"Mai departe ➜":"Termină misiunea 🏁"}</button></div>`}
 else{tries++;b.classList.add("bad");b.disabled=true;snd([200,150],"sawtooth");say(["Hopa! Mai încearcă 🤔","Aproape! Gândește-te iar.","Nu-i nimic, greșelile ne învață!"][tries%3]);
  if(tries>=2)$("#fb").textContent="💡 Indiciu: "+ex}}
function next(){k++;if(k<M[cur].q.length)ask();else finish()}
function finish(){done.add(cur);boom(160);snd([523,659,784,1047,1319]);say(`Misiune îndeplinită, ${name}! 🎖️`);
 view(`<div class="card center"><div class=trophy>🎖️</div><h2>Misiune îndeplinită!</h2><button class=big onclick="hub()">Înapoi la hartă 🗺️</button></div>`)}
function safe(){say("Introdu cele 4 cifre din carnetul tău!");
 view(`<div class="card center"><div class=trophy>🔐</div><h2>Seiful secret</h2><p class=q>Scrie codul din carnetul de detectiv</p><div>${[0,1,2,3].map(i=>`<input class=dg inputmode=numeric maxlength=1 oninput="dg(${i},this)">`).join("")}</div><div id=fb></div><button class=big onclick="openSafe()">Deschide!</button></div>`);document.querySelector(".dg").focus()}
function dg(i,el){el.value=el.value.replace(/\D/g,"");if(el.value&&i<3)document.querySelectorAll(".dg")[i+1].focus()}
function openSafe(){const c=[...document.querySelectorAll(".dg")].map(x=>x.value).join("");
 if(c=="9981"){snd([523,659,784,1047,1319,1568]);let n=0;const t=setInterval(()=>{boom(90,Math.random()*innerWidth,Math.random()*innerHeight*.5);if(++n>8)clearInterval(t)},350);say(`WOW, ${name}! Ai deschis seiful!`);
  view(`<div class="card center"><div class=trophy>🏆</div><h2>SEIF DESCHIS!</h2><p class=q>${name}, ești Agent de nivel EXPERT!<br>Ai strâns ${stars} ⭐ din ${TOTAL} la prima încercare.</p><button class=big onclick="location.reload()">Joc nou 🔄</button></div>`)}
 else{snd([200,150],"sawtooth");say("Codul nu e bun. Uită-te în carnet!");$("#fb").textContent="❌ Verifică cifrele din carnet și încearcă din nou."}}
intro();
</script></body></html>
